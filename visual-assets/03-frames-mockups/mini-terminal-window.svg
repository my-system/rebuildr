<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" fill="none">
  <defs>
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <g transform="translate(20, 20)" filter="url(#termShadow)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="500" height="280" rx="14" fill="#080c16" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="500" height="34" rx="14" fill="#0f172a" />
    <path d="M 0 24 L 500 24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Mac Traffic Light Dots -->
    <circle cx="18" cy="17" r="5" fill="#ef4444" />
    <circle cx="34" cy="17" r="5" fill="#f59e0b" />
    <circle cx="50" cy="17" r="5" fill="#10b981" />

    <!-- Title Bar Text -->
    <text x="250" y="22" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">
      rebuildr-ai · live-dom-stream
    </text>

    <!-- 8 Agents Badge -->
    <rect x="420" y="7" width="68" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" />
    <text x="454" y="21" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#34d399" text-anchor="middle">
      8 AGENTS
    </text>

    <!-- Stream Code Lines -->
    <g transform="translate(18, 54)">
      <!-- Line 1: Wireframe command -->
      <rect x="0" y="0" width="36" height="18" rx="4" fill="#10b981" />
      <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9" fill="#080c16" text-anchor="middle">WIRE</text>
      <text x="46" y="13" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11" fill="#cbd5e1">
        layout.box(<tspan fill="#38bdf8">"&lt;div class='card'&gt;"</tspan>, <tspan fill="#f59e0b">"420x260px"</tspan>)
      </text>

      <!-- Line 2: Polygon Triangulation -->
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="36" height="18" rx="4" fill="#06b6d4" />
        <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9" fill="#080c16" text-anchor="middle">MESH</text>
        <text x="46" y="13" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11" fill="#cbd5e1">
          svg.triangulate(<tspan fill="#a78bfa">18_vertices</tspan>, <tspan fill="#34d399">"delaunay"</tspan>)
        </text>
      </g>

      <!-- Line 3: Typing Heading -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="36" height="18" rx="4" fill="#f59e0b" />
        <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9" fill="#080c16" text-anchor="middle">TYPE</text>
        <text x="46" y="13" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11" fill="#cbd5e1">
          dom.type(<tspan fill="#38bdf8">"Creative Frontend &amp; WebGL"</tspan>)
        </text>
      </g>

      <!-- Line 4: Counter Roll -->
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="46" height="18" rx="4" fill="#3b82f6" />
        <text x="23" y="13" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9" fill="#080c16" text-anchor="middle">COUNT</text>
        <text x="56" y="13" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11" fill="#cbd5e1">
          counter.roll({ to: <tspan fill="#34d399">28</tspan>, ease: <tspan fill="#ec4899">"power3.out"</tspan> })
        </text>
      </g>

      <!-- Line 5: Dolly Zoom Active -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="36" height="18" rx="4" fill="#8b5cf6" />
        <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">ZOOM</text>
        <text x="46" y="13" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11" fill="#cbd5e1">
          camera.dollyFocus(<tspan fill="#facc15">".mission-card-3d"</tspan>, <tspan fill="#38bdf8">1.035</tspan>)
        </text>
      </g>

      <!-- Line 6: Active Cursor Prompt -->
      <g transform="translate(0, 146)">
        <text x="0" y="13" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#34d399">
          &gt; Yusuf · Lead Dev: stage.render(100%_complete)
        </text>
        <!-- Blinking Caret -->
        <rect x="330" y="2" width="7" height="14" fill="#10b981" />
      </g>
    </g>
  </g>
</svg>
