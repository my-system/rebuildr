<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
  <defs>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="electricSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Icon Container (Hexagon Glass Shield) -->
  <g transform="translate(40, 20)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="#0f172a" stroke="url(#neonEmerald)" stroke-width="2.5" fill-opacity="0.9" />
    <rect x="8" y="8" width="184" height="184" rx="36" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" fill="none" />
    
    <!-- Blueprint Corner Crosshairs -->
    <path d="M 24 38 L 40 38 M 32 30 L 32 46" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <path d="M 160 38 L 176 38 M 168 30 L 168 46" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <path d="M 24 162 L 40 162 M 32 154 L 32 170" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <path d="M 160 162 L 176 162 M 168 154 L 168 170" stroke="#38bdf8" stroke-width="2" opacity="0.8" />

    <!-- Lightning Bolt Reconstruct Icon -->
    <path d="M 116 32 L 64 114 L 102 114 L 84 172 L 144 94 L 106 94 Z" 
          fill="url(#neonEmerald)" 
          stroke="#a7f3d0" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#glow)" />
          
    <!-- Dynamic Orbit Nodes -->
    <circle cx="64" cy="114" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="144" cy="94" r="5" fill="#a855f7" filter="url(#glow)" />
    <circle cx="84" cy="172" r="5" fill="#34d399" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(280, 75)">
    <!-- Main Title -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="64" fill="url(#textGrad)" letter-spacing="3">
      REBUILDR
    </text>
    
    <!-- Studio Tag -->
    <text x="370" y="55" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" fill="url(#neonEmerald)" letter-spacing="4">
      STUDIO
    </text>

    <!-- Subtitle & Capabilities -->
    <text x="4" y="98" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" fill="#38bdf8" letter-spacing="1.5">
      // 8-AGENT AUTONOMOUS MOTION RECONSTRUCTOR
    </text>

    <!-- Version Pill Badge -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="138" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
      <text x="16" y="19" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#a7f3d0" letter-spacing="1">
        ⚡ v3.5 PRO EDIT
      </text>
    </g>
    
    <!-- 60FPS Badge -->
    <g transform="translate(150, 115)">
      <rect x="0" y="0" width="115" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#7dd3fc" letter-spacing="1">
        60 FPS WEBM
      </text>
    </g>
  </g>
</svg>
