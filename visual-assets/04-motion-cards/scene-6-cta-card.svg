<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" fill="none">
  <defs>
    <filter id="ctaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="960" height="560" rx="32" fill="#080c16" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  <rect x="8" y="8" width="944" height="544" rx="26" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3" fill="none" />

  <!-- Background Ambient Glow -->
  <circle cx="480" cy="200" r="160" fill="rgba(16, 185, 129, 0.1)" filter="blur(60px)" />

  <!-- Logo Pill Icon -->
  <g transform="translate(480, 70)">
    <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="1.8" />
    <path d="M -14 -10 L -24 3 L -16 3 L -20 12 L -8 -1 L -15 -1 Z" fill="#10b981" />
    <text x="2" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">
      REBUILDR
    </text>
  </g>

  <!-- Big Catchy Title -->
  <text x="480" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    Mau Bikin Video Showcase Seperti Ini?
  </text>
  <text x="480" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle">
    Tinggal pasang ekstensi Chrome, tekan spasi, dan rekam layarnya!
  </text>

  <!-- Giant Interactive CTA Button -->
  <g transform="translate(480, 310)" filter="url(#ctaGlow)">
    <rect x="-220" y="-36" width="440" height="72" rx="36" fill="#10b981" />
    <text x="0" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#080c16" text-anchor="middle" letter-spacing="1.5">
      🚀 COBAIN SEKARANG
    </text>
  </g>

  <!-- Social / Link Indicators Row -->
  <g transform="translate(480, 420)">
    <!-- Pill 1: Link in Bio -->
    <rect x="-240" y="-18" width="150" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="-165" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#cbd5e1" text-anchor="middle">
      🔗 Link di Bio
    </text>

    <!-- Pill 2: Chrome Extension -->
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#cbd5e1" text-anchor="middle">
      🧩 Chrome Store
    </text>

    <!-- Pill 3: Open Source GitHub -->
    <rect x="90" y="-18" width="150" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="165" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#cbd5e1" text-anchor="middle">
      ⭐ Star di GitHub
    </text>
  </g>

  <!-- Footnote -->
  <text x="480" y="500" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12" fill="#64748b" text-anchor="middle">
    Free &amp; Open Source // Creative Developer Tool
  </text>
</svg>
