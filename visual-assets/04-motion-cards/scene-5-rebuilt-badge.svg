<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <linearGradient id="goldEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="badgeFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <g transform="translate(300, 300)" filter="url(#badgeFilter)">
    <!-- Outer Starburst / Radial Polygon Ring -->
    <circle cx="0" cy="0" r="240" fill="#080c16" stroke="url(#goldEmerald)" stroke-width="4" />
    <circle cx="0" cy="0" r="222" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="8 6" fill="none" />
    <circle cx="0" cy="0" r="204" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="2" />

    <!-- Corner Decorative Notches -->
    <rect x="-12" y="-242" width="24" height="6" fill="#34d399" rx="3" />
    <rect x="-12" y="236" width="24" height="6" fill="#34d399" rx="3" />
    <rect x="-242" y="-12" width="6" height="24" fill="#34d399" rx="3" />
    <rect x="236" y="-12" width="6" height="24" fill="#34d399" rx="3" />

    <!-- Big Checkmark -->
    <circle cx="0" cy="-60" r="48" fill="#10b981" />
    <path d="M -18 -60 L -6 -48 L 20 -74" stroke="#080c16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Main Text -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      100%
    </text>
    <text x="0" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#34d399" text-anchor="middle" letter-spacing="3">
      REBUILT
    </text>
    <text x="0" y="104" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
      FROM SCRATCH
    </text>

    <!-- Star Icons -->
    <g transform="translate(0, 140)">
      <polygon points="0,-8 2,-2 8,-2 3,1 5,7 0,3 -5,7 -3,1 -8,-2 -2,-2" fill="#facc15" />
      <polygon points="-30,-8 -28,-2 -22,-2 -27,1 -25,7 -30,3 -35,7 -33,1 -38,-2 -32,-2" fill="#facc15" />
      <polygon points="30,-8 32,-2 38,-2 33,1 35,7 30,3 25,7 27,1 22,-2 28,-2" fill="#facc15" />
    </g>

    <!-- Subtitle Bottom Ribbon -->
    <text x="0" y="180" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
      // 8-CURSOR AI RECONSTRUCTION
    </text>
  </g>
</svg>
