<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" fill="none">
  <defs>
    <filter id="counterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Box (Active Focus Elevation 3D) -->
  <rect width="960" height="480" fill="#0b0f19" rx="28" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Subtle Internal Bokeh Circles -->
  <circle cx="180" cy="120" r="80" fill="rgba(56, 189, 248, 0.08)" filter="blur(30px)" />
  <circle cx="820" cy="380" r="100" fill="rgba(168, 85, 247, 0.08)" filter="blur(40px)" />

  <!-- Feature Badge -->
  <rect x="340" y="44" width="280" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
  <text x="480" y="66" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle" letter-spacing="2">
    🔢 KINETIC NUMBER COUNTER
  </text>

  <!-- 3 Stats Columns -->
  <!-- Stat 1: 28+ Proyek -->
  <g transform="translate(160, 200)" filter="url(#counterGlow)">
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="url(#numGrad)" text-anchor="middle" letter-spacing="-2">
      28+
    </text>
    <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#cbd5e1" text-anchor="middle">
      Karya &amp; Proyek Web
    </text>
    <text x="0" y="104" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">
      ROLL FROM 00 TO 28
    </text>
  </g>

  <!-- Divider 1 -->
  <line x1="320" y1="160" x2="320" y2="340" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Stat 2: 98% Skor -->
  <g transform="translate(480, 200)" filter="url(#counterGlow)">
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="url(#numGrad)" text-anchor="middle" letter-spacing="-2">
      98%
    </text>
    <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#cbd5e1" text-anchor="middle">
      Presisi Tata Letak
    </text>
    <text x="0" y="104" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">
      CUBIC EASE-OUT
    </text>
  </g>

  <!-- Divider 2 -->
  <line x1="640" y1="160" x2="640" y2="340" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Stat 3: 2026 Aktif -->
  <g transform="translate(800, 200)" filter="url(#counterGlow)">
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="url(#numGrad)" text-anchor="middle" letter-spacing="-2">
      2026
    </text>
    <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#cbd5e1" text-anchor="middle">
      Tahun Eksplorasi
    </text>
    <text x="0" y="104" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">
      APPLE KEYNOTE STYLE
    </text>
  </g>

  <!-- Bottom Caption -->
  <text x="480" y="430" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle">
    ✨ Angka berputar otomatis tanpa edit manual di After Effects
  </text>
</svg>
